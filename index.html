<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOEIC Writing Practice</title>
    <!-- Tailwind Play CDN sends no Access-Control-Allow-Origin header, so SRI +
         crossorigin is impossible (it breaks file:// loading via CORS). Pinned to
         a fixed version for determinism; SRI is applied to marked/dompurify via
         jsDelivr, which does send CORS headers. -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
      integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js"
      integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t"
      crossorigin="anonymous"
    ></script>
    <!-- iPadOS Safari fix: explicitly opt the statement + analysis regions into
         text selection. Safari ignores the default `user-select: auto` for
         JS-injected text inside layout containers, so long-press selection
         fails without this opt-in. user-select inherits to descendants. -->
    <style>
      #questionPromptText,
      #analysisResult,
      #questionPromptText *,
      #analysisResult * {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
    </style>

  </head>

  <body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
    <div class="max-w-3xl mx-auto space-y-6">
      <!-- API Key Header Config -->
      <div
        class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-3"
      >
        <div>
          <h1 class="font-bold text-lg text-gray-900">
            TOEIC Writing Assistant
          </h1>
          <p class="text-xs text-gray-500">
            Practice TOEIC Writing with direct AI feedback
          </p>
        </div>
        <div class="flex flex-col gap-2 w-full sm:w-auto sm:flex-none">
          <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
            <label for="modelSelect" class="sr-only text-xs text-gray-500"
              >Model</label
            >
            <select
              id="modelSelect"
              onchange="onModelChange()"
              class="border border-gray-300 rounded px-2 py-1 text-sm bg-white"
            ></select>
            <span id="modelHint" class="text-xs text-gray-400 hidden"></span>
            <input
              id="apiKeyInput"
              type="password"
              placeholder="Paste Gemini API Key"
              class="border border-gray-300 rounded px-3 py-1 text-sm flex-1 sm:w-64"
            />
            <button
              onclick="saveKey()"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1 rounded transition"
            >
              Save
            </button>
            <button
              onclick="clearKey()"
              class="border border-gray-300 text-gray-600 text-sm px-4 py-1 rounded transition"
            >
              Clear
            </button>
          </div>
          <div
            id="keyStatus"
            class="text-xs text-gray-500 h-5 sm:text-right"
          ></div>
        </div>
      </div>

      <!-- Practice Section -->
      <div
        class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4"
      >
        <div>
          <label
            for="questionSelect"
            class="block text-sm font-semibold text-gray-700 mb-1"
            >Select Question Prompt</label
          >
          <select
            id="questionSelect"
            onchange="loadQuestion()"
            class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white"
          ></select>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
          <h2 class="text-xs font-bold text-blue-700 uppercase tracking-wide">
            Question Task
          </h2>
          <div
            id="questionPromptText"
            class="text-sm text-blue-900 mt-1 font-medium"
          ></div>
        </div>

        <div>
          <label
            for="userInput"
            class="block text-sm font-semibold text-gray-700 mb-1"
            >Your Written Response</label
          >
          <textarea
            id="userInput"
            oninput="updateWordCount()"
            rows="8"
            class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="Type your answer here..."
          ></textarea>
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span id="wordCount">0 words</span>
            <span id="wordTargetHint"></span>
          </div>
        </div>

        <!-- Calibration anchors (ADR-002 T2, opt-in). The calibration file is
             gitignored and MUST NEVER be referenced or fetched by this app (ADR-004):
             the user selects it locally and it is read in-memory only via FileReader
             — never uploaded, embedded, or persisted. -->
        <div
          class="flex flex-wrap items-center gap-3 text-xs text-gray-600 border-t border-gray-200 pt-3"
        >
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              id="calibrationToggle"
              onchange="onCalibrationToggle()"
              disabled
            />
            Use calibration examples
          </label>
          <label class="cursor-pointer">
            <span
              class="border border-gray-300 text-gray-600 text-xs px-3 py-1 rounded transition hover:bg-gray-50"
              >Load calibration file…</span
            >
            <input
              type="file"
              id="calibrationFile"
              accept=".json,application/json"
              class="hidden"
              onchange="loadCalibrationFile(event)"
            />
          </label>
          <span id="calibrationStatus" class="text-[11px] text-gray-400"
            >No calibration file loaded (kept local — never uploaded).</span
          >
        </div>

        <button
          id="submitBtn"
          onclick="evaluateAnswer()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow"
        >
          Submit for Evaluation
        </button>

        <!-- P2 #2/#3: persistent history + export/import (client-only, ADR-001).
             History is stored in localStorage and never uploaded. Backup export/import
             uses Blob + FileReader (no fetch); the API key is included only on opt-in. -->
        <div class="border-t border-gray-200 pt-3 mt-3">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">
              History &amp; Backup
            </h3>
            <button
              id="clearHistoryBtn"
              type="button"
              onclick="clearHistory()"
              class="hidden text-[11px] text-red-600 hover:underline"
            >
              Clear history
            </button>
          </div>
          <div id="historyList" class="space-y-1"></div>
          <p id="historyEmpty" class="text-[11px] text-gray-400">
            No saved evaluations yet.
          </p>
          <div
            class="flex flex-wrap items-center gap-3 mt-3 text-xs text-gray-600 border-t border-gray-200 pt-3"
          >
            <button
              id="exportBtn"
              type="button"
              onclick="exportBackup()"
              class="border border-gray-300 text-gray-600 px-3 py-1 rounded transition hover:bg-gray-50"
            >
              Download backup
            </button>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="exportIncludeKey" />
              Include API key
            </label>
            <label class="cursor-pointer">
              <span
                class="border border-gray-300 text-gray-600 text-xs px-3 py-1 rounded transition hover:bg-gray-50"
                >Restore backup…</span
              >
              <input
                type="file"
                id="backupFile"
                accept=".json,application/json"
                class="hidden"
                onchange="importBackup(event)"
              />
            </label>
            <span id="backupStatus" class="text-[11px] text-gray-400"></span>
          </div>
        </div>
      </div>

      <!-- Analysis Output -->
      <div
        id="outputContainer"
        class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200"
      >
        <h2 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b">
          Examiner Evaluation
        </h2>
        <p class="text-xs text-amber-600 italic mb-3">
          AI estimate — not an official TOEIC score.
        </p>
        <div
          id="analysisResult"
          class="prose prose-sm max-w-none text-gray-700 space-y-2"
        ></div>
        <div
          id="provenance"
          class="text-[11px] text-gray-400 mt-3 pt-2 border-t border-gray-200"
        ></div>
      </div>
    </div>

    <script>
      // Bumped on any prompt change; returned in the evaluation provenance (ADR-002 T1#4).
      const PROMPT_VERSION = "1.0.0";

      // Canonical evaluation response schema (ADR-002 T1#1 / docs/model-provider-guide.md).
      const EVAL_RESPONSE_SCHEMA = {
        type: "object",
        properties: {
          criteria: {
            type: "array",
            items: {
              type: "object",
              properties: {
                name: { type: "string" },
                score: { type: "integer" },
                notes: { type: "string" },
              },
              required: ["name", "score", "notes"],
            },
          },
          final_score: { type: "integer" },
          band_justification: { type: "string" },
          error_analysis: { type: "string" },
          polished_revision: { type: "string" },
          key_recommendations: { type: "array", items: { type: "string" } },
          model_used: { type: "string" },
          prompt_version: { type: "string" },
          timestamp: { type: "string" },
        },
        required: [
          "criteria",
          "final_score",
          "band_justification",
          "error_analysis",
          "polished_revision",
          "key_recommendations",
        ],
      };

      const SYSTEM_PROMPT = `You are an expert ETS TOEIC Writing examiner. Evaluate the submitted response strictly according to official TOEIC criteria and output ONLY a JSON object matching the required schema (no markdown, no code fences).

Scoring bands by Part:
- Part 1 (score 0-3): decompose into sub-criteria "grammar", "task_completion", "word_usage".
- Part 2 (score 0-4): decompose into "sentence_quality_variety", "vocabulary", "organization".
- Part 3 (score 0-5): decompose into "thesis_and_support", "grammar", "vocabulary", "organization".

Determinism rules:
- Score deterministically. Do not add creative interpretation.
- Base every subscore strictly on the ETS criteria for the given Part.
- If a criterion is not met at all, score 0 for that criterion.
- final_score must be within the Part's band (Part 1: 0-3, Part 2: 0-4, Part 3: 0-5).

Output a JSON object with these fields:
- "criteria": array of { name (sub-criterion), score (integer), notes (brief rationale) }.
- "final_score": integer total within the band.
- "band_justification": short rationale for the final score.
- "error_analysis": specific grammar, word choice, or structural mistakes.
- "polished_revision": a native-level rewrite of the response.
- "key_recommendations": array of 2-3 actionable improvements.`;

      let QUESTIONS = [];
      let selectedQuestion = null;

      // Model dropdown mirror of docs/model-provider-guide.md (source of truth).
      // Inlined here because the ADR-003 split (scripts/models.js / App.models) is
      // deferred. Re-verify against the guide before each release (ADR-002 Tier 1 #3);
      // LAST_VERIFIED: 2026-08-16 — in sync (5 entries, default gemini-3.6-flash) and
      // temperature is intentionally omitted (deprecated on Gemini 3.x; never sent).
      const MODELS = [
        {
          id: "gemini-3.1-flash-lite",
          label: "Gemini 3.1 Flash-Lite",
          temp: false,
        },
        {
          id: "gemini-3.5-flash-lite",
          label: "Gemini 3.5 Flash-Lite",
          temp: false,
        },
        { id: "gemini-3.5-flash", label: "Gemini 3.5 Flash", temp: false },
        { id: "gemini-3.6-flash", label: "Gemini 3.6 Flash", temp: false },
        { id: "gemini-3.7-flash", label: "Gemini 3.7 Flash", temp: false },
      ];
      const DEFAULT_MODEL = "gemini-3.6-flash";

      window.onload = () => {
        initModelSelector();
        initQuestionSelector();
        try {
          const savedKey = localStorage.getItem("gemini_api_key");
          if (savedKey) document.querySelector("#apiKeyInput").value = savedKey;
        } catch (e) {
          console.error("localStorage not available:", e.message);
        }
      };

      // ADR-004 Phase 1: parse embedded JSON synchronously (no fetch).
      // ADR-006 init-time dev guard: throw on authoring mistakes (invalid/malformed bank).
      function loadQuestions() {
        const raw = document.querySelector("#questionBank").textContent;
        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          throw new Error(
            "Embedded question bank is not valid JSON: " + e.message,
          );
        }
        const questions = Array.isArray(data.questions) ? data.questions : [];
        const invalid = questions.filter((q) => !validateQuestion(q));
        if (invalid.length) {
          throw new Error(
            "Invalid question(s) in embedded bank: " +
              invalid.map((q) => (q && q.id) || "?").join(", "),
          );
        }
        return questions;
      }

      // Mirrors docs/question-schema.md validateQuestion(); returns false on bad entries.
      // loadQuestions() throws at init-time on any invalid entry (ADR-006 dev guard).
      function validateQuestion(q) {
        const maxByPart = { 1: 3, 2: 4, 3: 5 };
        const ok =
          [1, 2, 3].includes(q.part) &&
          typeof q.id === "string" &&
          q.id.startsWith("p" + q.part + "-") &&
          q.scoringBand &&
          q.scoringBand.min === 0 &&
          q.scoringBand.max === maxByPart[q.part] &&
          Array.isArray(q.rubricCriteria) &&
          q.rubricCriteria.length > 0 &&
          (q.part !== 1 ||
            (Array.isArray(q.targetWords) && q.targetWords.length === 2)) &&
          (q.part !== 2 ||
            (q.emailContext && typeof q.emailContext.body === "string")) &&
          (q.part !== 3 ||
            (typeof q.essayTopic === "string" && q.essayTopic.length > 10)) &&
          (q.part !== 2 ||
            !q.directives ||
            (Array.isArray(q.directives) &&
              q.directives.every(
                (d) => typeof d === "string" && d.trim().length > 0,
              ))) &&
          (q.part !== 3 ||
            !q.title ||
            (typeof q.title === "string" && q.title.trim().length > 0));
        return ok;
      }

      const PART_LABELS = {
        1: "Part 1: Write a sentence based on a picture",
        2: "Part 2: Respond to a written request",
        3: "Part 3: Opinion essay",
      };

      function shortLabel(q) {
        if (q.part === 1) return "Words: " + q.targetWords.join(", ");
        if (q.part === 2) return "Subject: " + q.emailContext.subject;
        return (
          "Topic: " +
          (q.title ||
            q.essayTopic.slice(0, 48) + (q.essayTopic.length > 48 ? "…" : ""))
        );
      }

      function initQuestionSelector() {
        try {
          QUESTIONS = loadQuestions();
        } catch (e) {
          const outputContainer = document.querySelector("#outputContainer");
          if (outputContainer) outputContainer.classList.remove("hidden");
          showError("Fatal: " + e.message);
          return;
        }
        const sel = document.querySelector("#questionSelect");
        sel.replaceChildren();
        [1, 2, 3].forEach((part) => {
          const group = QUESTIONS.map((q, i) => ({ q, i })).filter(
            (x) => x.q.part === part,
          );
          if (!group.length) return;
          const og = document.createElement("optgroup");
          og.label = PART_LABELS[part];
          group.forEach(({ q, i }) => {
            const opt = document.createElement("option");
            opt.value = String(i);
            opt.textContent = q.id + " — " + shortLabel(q);
            og.append(opt);
          });
          sel.append(og);
        });
        loadQuestion();
      }

      // Populate the model dropdown from MODELS; restore a valid saved choice or default.
      function initModelSelector() {
        const sel = document.querySelector("#modelSelect");
        sel.replaceChildren();
        MODELS.forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.label;
          opt.title = m.temp
            ? ""
            : "Temperature is not supported on this model";
          sel.append(opt);
        });
        let saved = null;
        try {
          saved = localStorage.getItem("gemini_model");
        } catch (e) {
          saved = null;
        }
        sel.value = MODELS.some((m) => m.id === saved) ? saved : DEFAULT_MODEL;
        updateModelHint();
        renderHistoryList();
      }

      // Persist the chosen model and refresh the optional temperature hint.
      function onModelChange() {
        const sel = document.querySelector("#modelSelect");
        try {
          localStorage.setItem("gemini_model", sel.value);
        } catch (e) {}
        updateModelHint();
      }

      // Show a hint only when the selected model does not support temperature.
      function updateModelHint() {
        const sel = document.querySelector("#modelSelect");
        const hint = document.querySelector("#modelHint");
        if (!hint) return;
        const m = MODELS.find((x) => x.id === sel.value);
        const unsupported = !m || m.temp === false;
        hint.textContent = unsupported
          ? "Temperature not supported on this model"
          : "";
        hint.hidden = !unsupported;
      }

      function loadQuestion() {
        const idx = parseInt(
          document.querySelector("#questionSelect").value,
          10,
        );
        const q = QUESTIONS[idx];
        selectedQuestion = q;
        const el = document.querySelector("#questionPromptText");
        el.replaceChildren();
        if (!q) return;

        const add = (text, cls) => {
          const d = document.createElement("div");
          if (cls) d.className = cls;
          d.textContent = text;
          el.append(d);
        };

        if (q.part === 1) {
          add(q.prompt);
          add(
            "Target words: " + q.targetWords.join(", "),
            "mt-2 text-sm text-blue-800",
          );
          if (q.imageAlt)
            add("Image: " + q.imageAlt, "mt-1 text-xs text-blue-700 italic");
        } else if (q.part === 2) {
          const e = q.emailContext;
          add(q.prompt);
          const box = document.createElement("div");
          box.className = "mt-2 text-sm text-blue-800 space-y-1";
          [
            ["From", e.from],
            ["To", e.to],
            ["Subject", e.subject],
            ["Sent", e.sent],
          ].forEach(([k, v]) => {
            const d = document.createElement("div");
            const b = document.createElement("strong");
            b.textContent = k + ": ";
            d.append(b);
            d.append(document.createTextNode(v));
            box.append(d);
          });
          const body = document.createElement("div");
          body.className =
            "mt-1 border-t border-blue-200 pt-1 whitespace-pre-line";
          body.textContent = e.body;
          box.append(body);
          el.append(box);
          if (q.directives && q.directives.length) {
            const dirWrap = document.createElement("div");
            dirWrap.className = "mt-3 text-sm text-blue-800";
            const dirHead = document.createElement("div");
            dirHead.className = "font-semibold text-blue-900";
            dirHead.textContent = "Your response should include:";
            dirWrap.append(dirHead);
            const ul = document.createElement("ul");
            ul.className = "list-disc list-inside mt-1 space-y-0.5";
            q.directives.forEach((d) => {
              const li = document.createElement("li");
              li.textContent = d;
              ul.append(li);
            });
            dirWrap.append(ul);
            el.append(dirWrap);
          }
        } else {
          add(q.prompt);
          if (q.title) add(q.title, "mt-2 text-sm font-semibold text-blue-900");
          add(q.essayTopic, "mt-2 text-sm text-blue-800");
        }

        const hint = document.querySelector("#wordTargetHint");
        if (hint)
          hint.textContent =
            q.wordTarget && q.wordTarget.hint ? q.wordTarget.hint : "";
        updateCalibrationStatus();
      }

      // Plain-text rendering of the selected question for the evaluator prompt.
      function buildQuestionText(q) {
        if (q.part === 1) {
          return (
            q.prompt +
            "\nTarget words: " +
            q.targetWords.join(", ") +
            (q.imageAlt ? "\nImage: " + q.imageAlt : "")
          );
        }
        if (q.part === 2) {
          const e = q.emailContext;
          let text =
            q.prompt +
            "\nFrom: " +
            e.from +
            "\nTo: " +
            e.to +
            "\nSubject: " +
            e.subject +
            "\nSent: " +
            e.sent +
            "\n\n" +
            e.body;
          if (q.directives && q.directives.length) {
            text +=
              "\n\nYour response should include:\n- " +
              q.directives.join("\n- ");
          }
          return text;
        }
        return (
          q.prompt +
          (q.title ? "\nTopic: " + q.title : "") +
          "\n" +
          q.essayTopic
        );
      }

      // --- ADR-002 T2: few-shot calibration anchors (opt-in, local file only) ---
      // The calibration file is gitignored and MUST NEVER be referenced or fetched by
      // this app (ADR-004). The user selects it via <input type="file">; it is read
      // in-memory with FileReader and never uploaded, embedded, or persisted.
      let calibrationAnchors = null; // { 1: [...], 2: [...], 3: [...] }
      let calibrationEnabled = false;

      // Read a locally-selected calibration JSON (gitignored; never leaves the browser).
      function loadCalibrationFile(event) {
        const input = event.target;
        const file = input.files && input.files[0];
        const toggle = document.querySelector("#calibrationToggle");
        if (!file) {
          calibrationAnchors = null;
          calibrationEnabled = false;
          if (toggle) {
            toggle.disabled = true;
            toggle.checked = false;
          }
          updateCalibrationStatus();
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => {
          calibrationAnchors = null;
          calibrationEnabled = false;
          if (toggle) {
            toggle.disabled = true;
            toggle.checked = false;
          }
          updateCalibrationStatus(
            "Could not read the selected file.",
            "text-red-600",
          );
        };
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            const src = data && data.calibrationAnchors;
            if (!src || typeof src !== "object")
              throw new Error("No 'calibrationAnchors' section in the file.");
            const cleaned = {};
            [1, 2, 3].forEach((p) => {
              const arr = src[p];
              if (!Array.isArray(arr)) return;
              const valid = arr.filter(
                (a) =>
                  a &&
                  typeof a.response === "string" &&
                  Array.isArray(a.criteria),
              );
              if (valid.length) cleaned[p] = valid;
            });
            if (!Object.keys(cleaned).length)
              throw new Error("No usable calibration examples found.");
            calibrationAnchors = cleaned;
            calibrationEnabled = false;
            if (toggle) {
              toggle.disabled = false;
              toggle.checked = false;
            }
            const counts = [1, 2, 3]
              .filter((p) => cleaned[p])
              .map((p) => "Part " + p + ": " + cleaned[p].length)
              .join(", ");
            updateCalibrationStatus(
              "Loaded (local only) — " + counts + ". Check to enable.",
              "text-green-600",
            );
          } catch (e) {
            calibrationAnchors = null;
            calibrationEnabled = false;
            if (toggle) {
              toggle.disabled = true;
              toggle.checked = false;
            }
            updateCalibrationStatus(
              "Load failed: " + e.message,
              "text-red-600",
            );
          }
        };
        reader.readAsText(file);
      }

      function onCalibrationToggle() {
        const toggle = document.querySelector("#calibrationToggle");
        calibrationEnabled = !!(toggle && toggle.checked);
        updateCalibrationStatus();
      }

      // Render the calibration-status line (optionally override message/color).
      function updateCalibrationStatus(message, colorClass) {
        const status = document.querySelector("#calibrationStatus");
        if (!status) return;
        if (message) {
          status.textContent = message;
          status.className = "text-[11px] " + (colorClass || "text-gray-400");
          return;
        }
        if (!calibrationAnchors) {
          status.textContent =
            "No calibration file loaded (kept local — never uploaded).";
          status.className = "text-[11px] text-gray-400";
          return;
        }
        const counts = [1, 2, 3]
          .filter((p) => calibrationAnchors[p])
          .map((p) => "P" + p + ":" + calibrationAnchors[p].length)
          .join(" ");
        if (calibrationEnabled) {
          const p = selectedQuestion ? selectedQuestion.part : null;
          const n =
            p && calibrationAnchors[p] ? calibrationAnchors[p].length : 0;
          status.textContent =
            "Calibration ON — " +
            counts +
            (p ? " · Part " + p + ": " + n + " injected" : "");
          status.className = "text-[11px] text-green-600";
        } else {
          status.textContent =
            "Loaded (local only) — " + counts + ". Check to enable.";
          status.className = "text-[11px] text-gray-400";
        }
      }

      // Build the few-shot calibration block for a Part, appended to the system prompt
      // when enabled (ADR-002 T2). Returns "" otherwise.
      function buildCalibrationSection(part) {
        if (!calibrationEnabled || !calibrationAnchors) return "";
        const anchors = calibrationAnchors[part];
        if (!Array.isArray(anchors) || !anchors.length) return "";
        const lines = [
          "",
          "=== CALIBRATION EXAMPLES (reference only — DO NOT score these; use them solely to anchor your scoring style for the student's answer) ===",
        ];
        anchors.forEach((a, i) => {
          lines.push(
            "Example " +
              (i + 1) +
              " (level: " +
              (a.level || "reference") +
              "):",
          );
          if (a.prompt) lines.push("Task: " + a.prompt);
          lines.push("Example response: " + a.response);
          if (Array.isArray(a.criteria) && a.criteria.length) {
            lines.push(
              "Score breakdown: " +
                a.criteria.map((c) => c.name + "=" + c.score).join(", "),
            );
          }
          if (a.rationale) lines.push("Rationale: " + a.rationale);
        });
        lines.push(
          "=== END CALIBRATION EXAMPLES — now return the JSON evaluation for the student's actual answer ===",
        );
        return lines.join("\n");
      }

      function saveKey() {
        const key = document.querySelector("#apiKeyInput").value.trim();
        try {
          localStorage.setItem("gemini_api_key", key);
          updateKeyStatus("✓ Key saved", "text-green-600");
        } catch (e) {
          updateKeyStatus(
            "✗ Save failed (localStorage blocked)",
            "text-red-600",
          );
        }
      }

      function clearKey() {
        try {
          localStorage.removeItem("gemini_api_key");
        } catch (e) {
          console.error("localStorage not available:", e.message);
        }
        document.querySelector("#apiKeyInput").value = "";
        updateKeyStatus("✓ Key cleared", "text-green-600");
      }

      function updateKeyStatus(message, colorClass) {
        const el = document.querySelector("#keyStatus");
        el.textContent = message;
        el.className = `text-xs h-5 sm:text-right ${colorClass}`;
        setTimeout(() => {
          el.textContent = "";
          el.className = "text-xs text-gray-500 h-5 sm:text-right";
        }, 3000);
      }

      function updateWordCount() {
        const text = document.querySelector("#userInput").value.trim();
        const count = text ? text.split(/\s+/).length : 0;
        document.querySelector("#wordCount").textContent = `${count} words`;
      }

      // --- ADR-006: centralized API error handling + dead-model recovery ---

      // Render an error message into the analysis output.
      function showError(message) {
        const root = document.querySelector("#analysisResult");
        root.replaceChildren(
          Object.assign(document.createElement("p"), {
            className: "text-red-600",
            textContent: message,
          }),
        );
      }

      // Show a pre-submit validation error in-page (replaces alert()).
      function showValidationError(message) {
        const outputContainer = document.querySelector("#outputContainer");
        if (outputContainer) outputContainer.classList.remove("hidden");
        showError(message);
      }

      // Classify an evaluation error and present one actionable message (ADR-006).
      function handleApiError(err, res) {
        const apiMsg =
          (err && err.message) || "Unknown error during evaluation.";
        let prefix = "";
        if (res) {
          if (res.status === 429) prefix = "Rate limit reached — ";
          else if (res.status === 401 || res.status === 403)
            prefix = "API key problem — ";
          else if (res.status === 400 || res.status === 404)
            prefix = "Model problem — ";
          else prefix = "Request failed (HTTP " + res.status + ") — ";
        } else if (err && /fetch|network/i.test(err.message || "")) {
          prefix = "Network error — ";
        }
        const message = prefix + apiMsg;
        showError(message);
        return message;
      }

      // --- ADR-002 T1#1 + T1#4: render structured evaluation output ---

      // Render a sanitized markdown field as a titled section.
      function renderMdSection(root, title, markdown) {
        if (markdown == null || markdown === "") return;
        const h = document.createElement("h3");
        h.className = "text-sm font-bold text-gray-800 mt-3";
        h.textContent = title;
        root.append(h);
        const d = document.createElement("div");
        d.className = "text-sm text-gray-700";
        d.append(
          DOMPurify.sanitize(marked.parse(markdown), {
            RETURN_DOM_FRAGMENT: true,
          }),
        );
        root.append(d);
      }

      function renderEvaluation(fb, maxScore, rootEl) {
        const root = rootEl || document.querySelector("#analysisResult");
        root.replaceChildren();
        const max = typeof maxScore === "number" ? maxScore : null;
        const suffix = max != null ? "/" + max : "";

        const finalH = document.createElement("h3");
        finalH.className = "text-base font-bold text-gray-900";
        finalH.textContent =
          "Estimated Score: " + (fb.final_score ?? "?") + suffix;
        root.append(finalH);

        if (Array.isArray(fb.criteria) && fb.criteria.length) {
          const h = document.createElement("h3");
          h.className = "text-sm font-bold text-gray-800 mt-3";
          h.textContent = "Criteria breakdown";
          root.append(h);
          const list = document.createElement("ul");
          list.className = "text-sm text-gray-700 space-y-0.5";
          fb.criteria.forEach((c) => {
            const li = document.createElement("li");
            const name = document.createElement("span");
            name.className = "font-medium";
            name.textContent = c.name + ": ";
            const score = document.createElement("span");
            score.className = "text-blue-700 font-semibibold";
            score.textContent = String(c.score) + suffix;
            li.append(name, score);
            if (c.notes) {
              const n = document.createElement("span");
              n.className = "text-gray-600";
              n.textContent = " — " + c.notes;
              li.append(n);
            }
            list.append(li);
          });
          root.append(list);
        }

        renderMdSection(root, "Band justification", fb.band_justification);
        renderMdSection(root, "Error analysis", fb.error_analysis);
        renderMdSection(root, "Polished revision", fb.polished_revision);

        if (
          Array.isArray(fb.key_recommendations) &&
          fb.key_recommendations.length
        ) {
          const h = document.createElement("h3");
          h.className = "text-sm font-bold text-gray-800 mt-3";
          h.textContent = "Key recommendations";
          root.append(h);
          const ul = document.createElement("ul");
          ul.className =
            "list-disc list-inside text-sm text-gray-700 space-y-0.5";
          fb.key_recommendations.forEach((r) => {
            const li = document.createElement("li");
            li.append(
              DOMPurify.sanitize(marked.parseInline(r), {
                RETURN_DOM_FRAGMENT: true,
              }),
            );
            ul.append(li);
          });
          root.append(ul);
        }

        const prov = document.querySelector("#provenance");
        if (prov && !rootEl) {
          const when = fb.timestamp
            ? new Date(fb.timestamp).toLocaleString()
            : "";
          prov.textContent =
            "Model: " +
            (fb.model_used || "?") +
            " · Prompt v" +
            (fb.prompt_version || "?") +
            (when ? " · " + when : "");
        }
      }

      // --- P2 #2/#3: persistent history + export/import (client-only, ADR-001) ---
      // History is stored in localStorage and never uploaded. Backup uses Blob +
      // FileReader (no fetch); the API key is included only on explicit opt-in.
      const HISTORY_KEY = "gemini_eval_history";
      const HISTORY_LIMIT = 50;
      const BACKUP_VERSION = 1;

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          console.error("loadHistory failed:", e.message);
          return [];
        }
      }

      function saveHistory(arr) {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
          return true;
        } catch (e) {
          console.error("saveHistory failed (quota?):", e.message);
          return false;
        }
      }

      // Persist one evaluation record (never throws into the scoring path).
      function recordEvaluation(fb, q, answer, calibrationOn, modelId) {
        try {
          const record = {
            id:
              (fb.timestamp || new Date().toISOString()) +
              "-" +
              Math.random().toString(36).slice(2, 8),
            ts: fb.timestamp || new Date().toISOString(),
            model: modelId || fb.model_used || "",
            part: q ? q.part : null,
            questionId: q ? q.id : null,
            prompt: (() => {
              try {
                return q ? buildQuestionText(q) : "";
              } catch (e) {
                return "";
              }
            })(),
            answer: answer || "",
            maxScore: q && q.scoringBand ? q.scoringBand.max : null,
            calibration: !!calibrationOn,
            promptVersion: fb.prompt_version || PROMPT_VERSION,
            result: fb,
          };
          const hist = loadHistory();
          hist.unshift(record);
          while (hist.length > HISTORY_LIMIT) hist.pop();
          saveHistory(hist);
          renderHistoryList();
        } catch (e) {
          console.error("recordEvaluation failed:", e.message);
        }
      }

      // Render the collapsible history list; each row expands to show the full
      // evaluation via the existing renderEvaluation() (reused with a scoped root).
      function renderHistoryList() {
        const list = document.querySelector("#historyList");
        const empty = document.querySelector("#historyEmpty");
        const clearBtn = document.querySelector("#clearHistoryBtn");
        if (!list) return;
        const hist = loadHistory();
        list.replaceChildren();
        if (!hist.length) {
          if (empty) empty.classList.remove("hidden");
          if (clearBtn) clearBtn.classList.add("hidden");
          return;
        }
        if (empty) empty.classList.add("hidden");
        if (clearBtn) clearBtn.classList.remove("hidden");
        hist.forEach((rec) => {
          const wrap = document.createElement("div");
          wrap.className = "border border-gray-200 rounded overflow-hidden";
          const head = document.createElement("button");
          head.type = "button";
          head.className =
            "w-full text-left px-2 py-1 hover:bg-gray-50 flex justify-between gap-2 items-center";
          const left = document.createElement("span");
          left.className = "text-gray-700";
          left.textContent =
            (rec.ts ? new Date(rec.ts).toLocaleString() : "?") +
            " · Part " +
            (rec.part ?? "?") +
            " · Q" +
            (rec.questionId ?? "?");
          const right = document.createElement("span");
          right.className = "text-blue-700 font-semibold whitespace-nowrap";
          const score =
            rec.result && rec.result.final_score != null
              ? rec.result.final_score
              : "?";
          const max = rec.maxScore != null ? rec.maxScore : "";
          right.textContent = score + (max !== "" ? "/" + max : "");
          if (rec.deadModel) {
            const warn = document.createElement("span");
            warn.className = "text-amber-600 text-[10px] ml-1";
            warn.textContent = "⚠ deprecated model";
            right.append(warn);
          }
          head.append(left, right);

          const detail = document.createElement("div");
          detail.className =
            "hidden px-2 py-2 border-t border-gray-100 text-gray-700 space-y-2";
          const pPrompt = document.createElement("div");
          const pLabel = document.createElement("div");
          pLabel.className = "text-[11px] font-bold text-gray-500 uppercase";
          pLabel.textContent = "Prompt";
          const pText = document.createElement("div");
          pText.className = "text-xs whitespace-pre-wrap";
          pText.textContent = rec.prompt || "";
          pPrompt.append(pLabel, pText);
          const pAns = document.createElement("div");
          const aLabel = document.createElement("div");
          aLabel.className = "text-[11px] font-bold text-gray-500 uppercase";
          aLabel.textContent = "Your answer";
          const aText = document.createElement("div");
          aText.className = "text-xs whitespace-pre-wrap";
          aText.textContent = rec.answer || "";
          pAns.append(aLabel, aText);
          const evalBox = document.createElement("div");
          evalBox.className = "prose prose-sm max-w-none";
          try {
            renderEvaluation(rec.result, rec.maxScore, evalBox);
          } catch (e) {
            evalBox.textContent = "(Could not render this evaluation.)";
          }
          detail.append(pPrompt, pAns, evalBox);
          head.onclick = () => detail.classList.toggle("hidden");
          wrap.append(head, detail);
          list.append(wrap);
        });
      }

      function clearHistory() {
        if (!confirm("Clear all saved evaluations? This cannot be undone."))
          return;
        try {
          localStorage.removeItem(HISTORY_KEY);
        } catch (e) {}
        renderHistoryList();
      }

      function updateBackupStatus(message, colorClass) {
        const el = document.querySelector("#backupStatus");
        if (!el) return;
        el.textContent = message;
        el.className = "text-[11px] " + (colorClass || "text-gray-400");
      }

      // P2 #3: export settings + history to a JSON file (Blob download; no fetch).
      function exportBackup() {
        try {
          const includeKey = !!(
            document.querySelector("#exportIncludeKey") &&
            document.querySelector("#exportIncludeKey").checked
          );
          const settings = {
            model: (() => {
              try {
                return localStorage.getItem("gemini_model") || DEFAULT_MODEL;
              } catch (e) {
                return DEFAULT_MODEL;
              }
            })(),
          };
          if (includeKey) {
            try {
              const k = localStorage.getItem("gemini_api_key");
              if (k) settings.apiKey = k;
            } catch (e) {}
          }
          const backup = {
            backupVersion: BACKUP_VERSION,
            exportedAt: new Date().toISOString(),
            promptVersion: PROMPT_VERSION,
            settings,
            history: loadHistory(),
          };
          const blob = new Blob([JSON.stringify(backup, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
          a.href = url;
          a.download = "english-active-backup-" + stamp + ".json";
          document.body.append(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          updateBackupStatus("Backup downloaded.", "text-green-600");
        } catch (e) {
          updateBackupStatus("Export failed: " + e.message, "text-red-600");
        }
      }

      // P2 #3 + ADR-006: import a backup (FileReader), restore settings + history,
      // and run the import-time dead-model check against the current MODELS list.
      function importBackup(event) {
        const input = event.target;
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onerror = () =>
          updateBackupStatus("Could not read the file.", "text-red-600");
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (
              !data ||
              typeof data !== "object" ||
              !Array.isArray(data.history) ||
              typeof data.backupVersion !== "number"
            )
              throw new Error("Not a valid backup file.");
            const knownIds = MODELS.map((m) => m.id);
            const deadModels = new Set();

            if (data.settings && typeof data.settings.model === "string") {
              const m = data.settings.model;
              if (!knownIds.includes(m)) deadModels.add(m);
              try {
                localStorage.setItem("gemini_model", m);
              } catch (e) {}
              const sel = document.querySelector("#modelSelect");
              if (sel) sel.value = m;
            }

            const byId = new Map(loadHistory().map((r) => [r.id, r]));
            (data.history || []).forEach((r) => {
              if (r && r.id) {
                byId.set(r.id, r);
                if (r.model && !knownIds.includes(r.model))
                  deadModels.add(r.model);
              }
            });
            let merged = Array.from(byId.values());
            merged.sort((a, b) => (b.ts || "").localeCompare(a.ts || ""));
            while (merged.length > HISTORY_LIMIT) merged.pop();
            saveHistory(merged);

            if (data.settings && typeof data.settings.apiKey === "string") {
              if (confirm("The backup includes an API key. Restore it?")) {
                try {
                  localStorage.setItem("gemini_api_key", data.settings.apiKey);
                } catch (e) {}
              }
            }

            renderHistoryList();

            // ADR-006: flag/switch unknown or deprecated models from the import.
            if (deadModels.size) {
              const list = Array.from(deadModels).join(", ");
              if (
                confirm(
                  "Backup references unknown/deprecated model(s): " +
                    list +
                    ". Switch to default (" +
                    DEFAULT_MODEL +
                    ")?",
                )
              ) {
                try {
                  localStorage.setItem("gemini_model", DEFAULT_MODEL);
                } catch (e) {}
                const sel = document.querySelector("#modelSelect");
                if (sel) sel.value = DEFAULT_MODEL;
                merged.forEach((r) => {
                  if (r.model && !knownIds.includes(r.model))
                    r.deadModel = true;
                });
                saveHistory(merged);
                updateBackupStatus(
                  "Restored. Switched deprecated model(s) to " +
                    DEFAULT_MODEL +
                    ".",
                  "text-amber-600",
                );
              } else {
                updateBackupStatus(
                  "Restored, but deprecated model(s) left as-is: " + list + ".",
                  "text-amber-600",
                );
              }
            } else {
              updateBackupStatus(
                "Backup restored (" + merged.length + " records).",
                "text-green-600",
              );
            }
          } catch (e) {
            updateBackupStatus("Import failed: " + e.message, "text-red-600");
          } finally {
            input.value = "";
          }
        };
        reader.readAsText(file);
      }

      async function evaluateAnswer() {
        const apiKey = (() => {
          try {
            return (
              localStorage.getItem("gemini_api_key") ||
              document.querySelector("#apiKeyInput").value.trim()
            );
          } catch (e) {
            return document.querySelector("#apiKeyInput").value.trim();
          }
        })();
        const answer = document.querySelector("#userInput").value.trim();
        const q = selectedQuestion;
        const modelId =
          document.querySelector("#modelSelect").value || DEFAULT_MODEL;
        try {
          localStorage.setItem("gemini_model", modelId);
        } catch (e) {}

        if (!apiKey)
          return showValidationError(
            "Please enter and save your Gemini API Key first.",
          );
        if (!answer)
          return showValidationError(
            "Please write an answer before submitting.",
          );
        if (!q) return showValidationError("Please select a question first.");

        const partContext =
          `This is a TOEIC Writing Part ${q.part} task (score range 0-${q.scoringBand.max}). ` +
          `Evaluate specifically against these criteria: ${q.rubricCriteria.join(", ")}.`;
        const questionText = buildQuestionText(q);

        const submitBtn = document.querySelector("#submitBtn");
        const outputContainer = document.querySelector("#outputContainer");
        const analysisResult = document.querySelector("#analysisResult");

        submitBtn.disabled = true;
        submitBtn.textContent = "Analyzing response...";
        outputContainer.classList.remove("hidden");
        analysisResult.textContent =
          "Evaluating your submission against TOEIC rubrics...";

        let lastResponse = null;
        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                systemInstruction: {
                  parts: [
                    { text: SYSTEM_PROMPT + buildCalibrationSection(q.part) },
                  ],
                },
                contents: [
                  {
                    parts: [
                      {
                        text: `${partContext}\n\nQuestion Prompt:\n${questionText}\n\nStudent Answer:\n${answer}`,
                      },
                    ],
                  },
                ],
                generationConfig: {
                  responseMimeType: "application/json",
                  responseSchema: EVAL_RESPONSE_SCHEMA,
                },
              }),
            },
          );
          lastResponse = response;

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(
              errData.error?.message ||
                `HTTP ${response.status}: ${response.statusText}`,
            );
          }
          const data = await response.json();
          if (data.error) throw new Error(data.error.message);

          const candidate = data.candidates?.[0];
          if (!candidate?.content?.parts?.[0]?.text) {
            throw new Error(
              "No response generated. The content may have been filtered.",
            );
          }
          let feedback;
          try {
            feedback = JSON.parse(candidate.content.parts[0].text);
          } catch (e) {
            throw new Error("The evaluation response was not valid JSON.");
          }
          feedback.model_used = modelId;
          feedback.prompt_version = PROMPT_VERSION;
          feedback.timestamp = new Date().toISOString();
          recordEvaluation(feedback, q, answer, calibrationEnabled, modelId);
          renderEvaluation(feedback, q.scoringBand ? q.scoringBand.max : null);
        } catch (err) {
          handleApiError(err, lastResponse);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit for Evaluation";
        }
      }
    </script>
  </body>
</html>
