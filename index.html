<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Writing Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- API Key Header Config -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="font-bold text-lg text-gray-900">TOEIC Writing Assistant</h1>
        <p class="text-xs text-gray-500">Practice TOEIC Writing with direct AI feedback</p>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <input id="apiKeyInput" type="password" placeholder="Paste Gemini API Key" class="border border-gray-300 rounded px-3 py-1 text-sm flex-1 sm:w-64">
        <button onclick="saveKey()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1 rounded transition">Save</button>
        <button onclick="clearKey()" class="border border-gray-300 text-gray-600 text-sm px-4 py-1 rounded transition">Clear</button>
      </div>
    </div>

    <!-- Practice Section -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Select Question Prompt</label>
        <select id="questionSelect" onchange="loadQuestion()" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white">
          <option value="0">Part 1: Write a sentence based on a picture (Words: schedule, reschedule)</option>
          <option value="1">Part 2: Respond to an email request (Subject: Office renovation schedule)</option>
          <option value="2">Part 3: Opinion Essay (Topic: Remote work vs. Office work)</option>
        </select>
      </div>

      <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
        <h2 class="text-xs font-bold text-blue-700 uppercase tracking-wide">Question Task</h2>
        <p id="questionPromptText" class="text-sm text-blue-900 mt-1 font-medium"></p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Your Written Response</label>
        <textarea id="userInput" oninput="updateWordCount()" rows="8" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Type your answer here..."></textarea>
        <div class="flex justify-between text-xs text-gray-500 mt-1">                                                                                                                                                           
          <span id="wordCount">0 words</span>                                                                                                                                                                                   
          <span>TOEIC Part 3 target: ~300 words</span>                                                                                                                                                                          
        </div> 
      </div>

      <button id="submitBtn" onclick="evaluateAnswer()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow">
        Submit for Evaluation
      </button>
    </div>

    <!-- Analysis Output -->
    <div id="outputContainer" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b">Examiner Evaluation</h2>
      <div id="analysisResult" class="prose prose-sm max-w-none text-gray-700 space-y-2"></div>
    </div>

  </div>

  <script>
    const SYSTEM_PROMPT = `You are an expert ETS TOEIC Writing examiner. Evaluate the user's submitted response strictly according to official TOEIC criteria:
- Part 1 (Questions 1 to 5): Sentence based on a picture and 2 target words (Score 0-3).
- Part 2 (Questions 6 to 7): Email response addressing all requirements (Score 0-4).
- Part 3 (Question 8): Opinion essay (~300 words) with clear thesis and coherence (Score 0-5).

Format your output clearly in Markdown:
1. **Estimated Score:** Give numerical rubric score and converted 0-200 scale estimate.
2. **Error Analysis:** List specific grammar, word choice, or structural mistakes.
3. **Polished Revision:** Provide a native-level rewrite of their response.
4. **Key Recommendations:** Give 2 actionable ways to improve.`;

    const QUESTIONS = [
      "Part 1: Write ONE sentence based on a office scene using the two words: 'schedule' and 'reschedule'.",
      "Part 2: You received an email asking about delays in the Q3 marketing project. Write an email response providing 2 reasons for the delay and proposing a new deadline.",
      "Part 3: Do you agree or disagree with the following statement? 'Working from home is more productive than working in a traditional office.' Give specific reasons and examples to support your opinion."
    ];

    window.onload = () => {                                                                                                                                                                                                 
      loadQuestion();                                                                                                                                                                                                       
      try {                                                                                                                                                                                                                 
        const savedKey = localStorage.getItem('gemini_api_key');                                                                                                                                                            
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;                                                                                                                                              
      } catch (e) {                                                                                                                                                                                                         
        console.warn('localStorage not available:', e.message);                                                                                                                                                             
      }                                                                                                                                                                                                                     
    }; 

    function saveKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', key);
      alert('API Key saved locally in your browser.');
    }

    function clearKey() {                                                                                                                                                                                                   
      localStorage.removeItem('gemini_api_key');                                                                                                                                                                            
      document.getElementById('apiKeyInput').value = '';                                                                                                                                                                    
      alert('API Key removed.');                                                                                                                                                                                            
    } 

    function loadQuestion() {
      const idx = document.getElementById('questionSelect').value;
      document.getElementById('questionPromptText').innerText = QUESTIONS[idx];
    }

    function updateWordCount() {                                                                                                                                                                                            
      const text = document.getElementById('userInput').value.trim();                                                                                                                                                       
      const count = text ? text.split(/\s+/).length : 0;                                                                                                                                                                    
      document.getElementById('wordCount').innerText = `${count} words`;                                                                                                                                                    
    } 

    async function evaluateAnswer() {
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
      const answer = document.getElementById('userInput').value.trim();
      const question = document.getElementById('questionPromptText').innerText;

      if (!apiKey) return alert('Please enter and save your Gemini API Key first.');
      if (!answer) return alert('Please write an answer before submitting.');

      const submitBtn = document.getElementById('submitBtn');
      const outputContainer = document.getElementById('outputContainer');
      const analysisResult = document.getElementById('analysisResult');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Analyzing response...';
      outputContainer.classList.remove('hidden');
      analysisResult.innerHTML = '<p class="text-gray-500 italic">Evaluating your submission against TOEIC rubrics...</p>';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: [{ parts: [{ text: `Question Prompt:\n${question}\n\nStudent Answer:\n${answer}` }] }]
          })
        });

        if (!response.ok) {                                                                                                                                                                                                     
          const errData = await response.json().catch(() => ({}));                                                                                                                                                              
          throw new Error(errData.error?.message || `HTTP ${response.status}: ${response.statusText}`);                                                                                                                         
        }                                                                                                                                                                                                                       
        const data = await response.json();                                                                                                                                                                                     
        if (data.error) throw new Error(data.error.message);  

        const candidate = data.candidates?.[0];
        if (!candidate?.content?.parts?.[0]?.text) {
          throw new Error("No response generated. The content may have been filtered.");
        }
        const feedbackMarkdown = candidate.content.parts[0].text;
        analysisResult.innerHTML = DOMPurify.sanitize(marked.parse(feedbackMarkdown));
      } catch (err) {
        analysisResult.innerHTML = `<p class="text-red-600">Error generating evaluation: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit for Evaluation';
      }
    }
  </script>
</body>
</html>
